services:
  - type: web
    name: petty-theft-server
    runtime: node
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      # Optional: OpenAI bot strategy. Bots work without these.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BOTS_ENABLED
        value: "true"
      - key: OPENAI_BOT_MODEL
        value: gpt-4.1-mini
